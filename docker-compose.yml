services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: local_explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local_explorer"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      args:
        INSTALL_E5: ${INSTALL_E5:-false}
        INSTALL_ML: ${INSTALL_ML:-false}
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/local_explorer}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_GENERAL_PER_MINUTE: ${RATE_LIMIT_GENERAL_PER_MINUTE:-120}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-20}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Local Explorer AI}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-5}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-5173}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-goong}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-goong}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      GOONG_API_BASE_URL: ${GOONG_API_BASE_URL:-https://rsapi.goong.io}
      GOONG_TIMEOUT_SECONDS: ${GOONG_TIMEOUT_SECONDS:-8}
      GOONG_ETA_TTL_SECONDS: ${GOONG_ETA_TTL_SECONDS:-300}
      GEOCODE_CACHE_TTL_SECONDS: ${GEOCODE_CACHE_TTL_SECONDS:-86400}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      APP_SIGNING_SECRET: ${APP_SIGNING_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-7200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:5173}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-localexplorerai@admin.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_TRAVELER_EMAIL: ${DEMO_TRAVELER_EMAIL:-baothang@gmail.com}
      DEMO_TRAVELER_PASSWORD: ${DEMO_TRAVELER_PASSWORD:-}
      E5_MODEL_PATH: ${E5_MODEL_PATH:-/models/e5}
      RANKER_MODEL_DIR: ${RANKER_MODEL_DIR:-/models/ai-ranker}
      FLOOD_MODEL_DIR: ${FLOOD_MODEL_DIR:-/models/flood-risk}
      ALLOW_UNVERIFIED_RANKER: ${ALLOW_UNVERIFIED_RANKER:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./models:/models:ro
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build:
      context: ./apps/api
      args:
        INSTALL_E5: ${INSTALL_E5:-false}
        INSTALL_ML: ${INSTALL_ML:-false}
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/local_explorer}
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Local Explorer AI}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "scripts.worker"]

  web:
    build:
      context: ./apps/web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  postgres_data:
