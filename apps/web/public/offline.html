<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#064e3b" />
    <title>Đang ngoại tuyến · Local Explorer AI</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f2f5f2; color: #18352d; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 520px; padding: 28px; border: 1px solid #d5e2da; border-radius: 18px; background: white; box-shadow: 0 16px 50px #18352d12; }
      h1 { margin-top: 0; font-size: 1.5rem; }
      button { border: 0; border-radius: 10px; padding: 11px 16px; background: #087a50; color: white; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Các trang đã tải và một số thông tin địa điểm có thể còn trong thiết bị. Đặt chỗ, lịch trống và trạng thái hiện tại cần kết nối mạng để kiểm tra lại.</p>
      <button type="button" onclick="location.reload()">Thử kết nối lại</button>
    </main>
  </body>
</html>
