# Docker Compose Production Configuration
services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always

  portal:
    build:
      context: ./apps/portal
      dockerfile: Dockerfile
    ports:
      - "${PORTAL_PORT:-8081}:80"
    restart: always

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        INSTALL_E5: ${INSTALL_E5:-false}
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the PostgreSQL/PostGIS service}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL for shared rate limits and worker heartbeat}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_GENERAL_PER_MINUTE: ${RATE_LIMIT_GENERAL_PER_MINUTE:-120}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-20}
      RATE_LIMIT_COSTLY_PER_MINUTE: ${RATE_LIMIT_COSTLY_PER_MINUTE:-30}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Local Explorer AI}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-goong}
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-goong}
      GOONG_API_KEY: ${GOONG_API_KEY:?Set GOONG_API_KEY for routing and geocoding}
      GOONG_API_BASE_URL: ${GOONG_API_BASE_URL:-https://rsapi.goong.io}
      GOONG_TIMEOUT_SECONDS: ${GOONG_TIMEOUT_SECONDS:-8}
      GOONG_ETA_TTL_SECONDS: ${GOONG_ETA_TTL_SECONDS:-300}
      GEOCODE_CACHE_TTL_SECONDS: ${GEOCODE_CACHE_TTL_SECONDS:-86400}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://localhost:8000/api/auth/google/callback}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACES_MONTHLY_CALL_CAP: ${GOOGLE_PLACES_MONTHLY_CALL_CAP:-900}
      GOOGLE_PLACES_CACHE_HOURS: ${GOOGLE_PLACES_CACHE_HOURS:-24}
      WEB_APP_URL: ${WEB_APP_URL:-https://localhost}
      PORTAL_APP_URL: ${PORTAL_APP_URL:-}
      VNPAY_ENVIRONMENT: ${VNPAY_ENVIRONMENT:-production}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-vnpay}
      MOMO_ENVIRONMENT: ${MOMO_ENVIRONMENT:-production}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_API_URL: ${MOMO_API_URL:-https://payment.momo.vn/v2/gateway/api/create}
      MOMO_RETURN_URL: ${MOMO_RETURN_URL:-}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-}
      INTEGRATION_SECRETS_KEY: ${INTEGRATION_SECRETS_KEY:?Set INTEGRATION_SECRETS_KEY to encrypt admin-managed integration credentials}
      E5_MODEL_PATH: ${E5_MODEL_PATH:-/models/e5}
      APP_SIGNING_SECRET: ${APP_SIGNING_SECRET:?Set APP_SIGNING_SECRET for provider confirmation}
      AUTH_JWT_KEY_ID: ${AUTH_JWT_KEY_ID:?Set AUTH_JWT_KEY_ID (python -m scripts.generate_auth_keys)}
      AUTH_JWT_PRIVATE_KEY_B64: ${AUTH_JWT_PRIVATE_KEY_B64:?Set AUTH_JWT_PRIVATE_KEY_B64 (RS256 signing key, base64 PEM)}
      AUTH_JWT_PUBLIC_KEYS_B64: ${AUTH_JWT_PUBLIC_KEYS_B64:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-local-explorer-ai}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-local-explorer-api}
    restart: always
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to PostgreSQL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL for shared rate limits and worker heartbeat}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Local Explorer AI}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-5}
    depends_on:
      api:
        condition: service_healthy
    restart: always
    command: ["python", "-m", "scripts.worker"]
