  <text x="72" y="33" fill="#f8fafc" font-family="'Segoe UI', 'Be Vietnam Pro', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.2">Technical Documentation</text>
  <text x="72" y="53" fill="#94a3b8" font-family="'Segoe UI', 'Be Vietnam Pro', Roboto, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="0.3">Architecture · AI &amp; ML · Planning · API · Demo</text>

