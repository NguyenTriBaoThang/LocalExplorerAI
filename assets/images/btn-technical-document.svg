  <path d="M28 24h10l6 6v16a2 2 0 0 1-2 2H28a2 2 0 0 1-2-2V26a2 2 0 0 1 2-2z" fill="none" stroke="#04131a" stroke-width="2.2" stroke-linejoin="round"/>
