[project]
name = "travility-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "numpy>=2.0",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "openai>=1.50",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "tzdata>=2026.4",
  "redis>=5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
